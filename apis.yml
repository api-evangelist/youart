aid: youart
name: Youart
description: >-
  YouArt is an all-in-one AI creative studio out of Y Combinator (founded 2025,
  San Francisco), positioned as "Patreon for AI Originals." It lets creators
  browse and run 60+ leading image, video, audio, and text-to-speech models —
  GPT Image 2, Nano Banana, Seedream, Sora 2, Kling, Veo 3, ElevenLabs v3, Suno —
  or compose them into multi-model, node-based creative workflows on a canvas.
  Agents and developers connect over a hosted, OAuth-secured Model Context
  Protocol (MCP) server to generate images, video, and audio and assemble
  workflows from chat, sharing the same account, credits, and projects as the
  web application. Creators can also launch original AI films and series, get
  funded directly by fans, and earn subscription revenue.
